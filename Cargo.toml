[workspace]
members = [
    "crates/liaison-core",
    "crates/liaison-protocol",
    "crates/liaison-runtime",
    "crates/liaison-client",
    "apps/liaison-service",
    "apps/liaison-cli",
    "apps/liaison-desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.77"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
liaison-core = { path = "crates/liaison-core" }
liaison-protocol = { path = "crates/liaison-protocol" }
liaison-runtime = { path = "crates/liaison-runtime" }
liaison-client = { path = "crates/liaison-client" }
