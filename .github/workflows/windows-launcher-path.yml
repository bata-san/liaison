name: Windows launcher path test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  launcher-path:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Unicode parenthesized path
        shell: powershell
        run: |
          $testRoot = Join-Path $PWD "launcher-test\科学部(生徒用)\liaison-server"
          $scripts = Join-Path $testRoot "scripts"
          New-Item -ItemType Directory -Force -Path $scripts | Out-Null
          Copy-Item "scripts\install-server-launcher.cmd" (Join-Path $testRoot "Install Liaison Server.cmd")
          Set-Content -Path (Join-Path $scripts "install-server-bundle.ps1") -Value "exit 0" -Encoding UTF8
          Remove-Item (Join-Path $env:TEMP "LiaisonServerLauncher.log") -Force -ErrorAction SilentlyContinue

      - name: Run launcher from Unicode parenthesized path
        shell: cmd
        working-directory: launcher-test/科学部(生徒用)/liaison-server
        env:
          LIAISON_LAUNCHER_TEST: "1"
        run: call "Install Liaison Server.cmd"

      - name: Verify launcher result
        shell: powershell
        run: |
          $launcherLog = Join-Path $env:TEMP "LiaisonServerLauncher.log"
          if (-not (Test-Path $launcherLog)) {
            throw "Launcher log was not created."
          }
          Write-Host "--- launcher log ---"
          Get-Content $launcherLog
          Write-Host "--- end launcher log ---"
          if (-not (Select-String -Path $launcherLog -SimpleMatch "PowerShell exited with code 0." -Quiet)) {
            throw "Launcher did not record a successful PowerShell exit."
          }

      - name: Upload launcher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-path-diagnostics
          path: ${{ runner.temp }}\LiaisonServerLauncher.log
          if-no-files-found: warn
