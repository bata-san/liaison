name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/liaison-desktop
        run: npm install

      - name: Build frontend
        working-directory: apps/liaison-desktop
        run: npm run build

      - name: Run Rust tests
        id: rust_tests
        shell: powershell
        continue-on-error: true
        run: |
          $Output = & cargo test --workspace 2>&1
          $ExitCode = $LASTEXITCODE
          $Output | Out-File -FilePath cargo-test.log -Encoding utf8
          if ($ExitCode -ne 0) {
            $Output | Select-Object -Last 160
            exit $ExitCode
          }

      - name: Upload Rust diagnostics
        if: steps.rust_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-diagnostics
          path: cargo-test.log
          if-no-files-found: error

      - name: Fail after Rust test diagnostics
        if: steps.rust_tests.outcome == 'failure'
        shell: powershell
        run: exit 1

      - name: Build Windows binaries
        run: cargo build -p liaison-service -p liaison-cli -p liaison-desktop

      - name: Run end-to-end smoke test
        shell: powershell
        run: .\scripts\smoke-test.ps1 -SkipBuild

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: liaison-windows-debug
          path: |
            target/debug/liaison-service.exe
            target/debug/liaison-cli.exe
            target/debug/liaison-desktop.exe
          if-no-files-found: error
