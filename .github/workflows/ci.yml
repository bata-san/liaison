name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate server setup script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup-server.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Validate client setup script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup-client.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Validate client launcher script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/start-client.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Validate distribution builder script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build-distributions.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/liaison-desktop
        run: npm install

      - name: Build frontend
        working-directory: apps/liaison-desktop
        run: npm run build

      - name: Test core scheduler
        run: cargo test -p liaison-core

      - name: Test protocol
        run: cargo test -p liaison-protocol

      - name: Test client
        run: cargo test -p liaison-client

      - name: Test runtime adapters
        run: cargo test -p liaison-runtime

      - name: Test service orchestration
        run: cargo test -p liaison-service

      - name: Check desktop Rust bridge
        run: cargo check -p liaison-desktop

      - name: Build Windows binaries
        run: cargo build -p liaison-service -p liaison-cli -p liaison-desktop

      - name: Run end-to-end smoke test
        shell: powershell
        run: .\scripts\smoke-test.ps1 -SkipBuild

      - name: Build release binaries
        run: cargo build --release -p liaison-service -p liaison-cli -p liaison-desktop

      - name: Package server and client distributions
        shell: powershell
        run: .\scripts\build-distributions.ps1 -SkipBuild -SkipTests

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: liaison-windows-release
          path: |
            dist/liaison-server-windows.zip
            dist/liaison-client-windows.zip
          if-no-files-found: error

      - name: Upload test binaries
        uses: actions/upload-artifact@v4
        with:
          name: liaison-windows-debug
          path: |
            target/debug/liaison-service.exe
            target/debug/liaison-cli.exe
            target/debug/liaison-desktop.exe
          if-no-files-found: error
