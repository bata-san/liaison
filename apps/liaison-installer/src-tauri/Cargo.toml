[workspace]

[package]
name = "liaison-installer"
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
description = "Unified Liaison server and client setup"

[build-dependencies]
base64 = "0.22"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
